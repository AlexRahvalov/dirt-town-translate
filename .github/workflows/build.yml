name: Build Runtime Locale Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate translation JSONs
        run: python validate_translations.py

      - name: Configure CMake
        run: cmake -S plugin -B build -A x64

      - name: Build version.dll
        run: cmake --build build --config Release

      - name: Package plugin zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/version.dll dist/version.dll
          Copy-Item -Recurse locales dist/locales
          Compress-Archive -Path dist/version.dll, dist/locales -DestinationPath DirtTownDemo-Locale-Plugin.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirtTownDemo-Locale-Plugin
          path: DirtTownDemo-Locale-Plugin.zip

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $capture = $false
          $out = @()
          foreach ($line in $lines) {
            if ($line -match "^## \[$([regex]::Escape($ver))\]") {
              $capture = $true
              continue
            }
            if ($capture -and $line -match '^## \[') {
              break
            }
            if ($capture) {
              $out += $line
            }
          }
          $body = ($out -join "`n").Trim()
          if (-not $body) {
            $body = "Release $tag"
          }
          Set-Content -Path release_notes.md -Value $body -Encoding UTF8

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DirtTownDemo-Locale-Plugin.zip
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
